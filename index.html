<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Intercambio de Videojuegos</title> 
    <link rel="stylesheet" href="styles.css"> 
    <script src="app.js" defer></script> 
</head> 
<body>
    <header>
            <nav>
                <ul>
                    <li><a>Videojuegos</a></li>
                    <li><a>Consolas</a></li>
                    <li><a>Merch</a></li>
                    <li><a>Empresa</a></li>
                    <li><a>Cuenta</a></li>
                </ul>
            </nav>
    </header>


    <form id="formulario" class="contenedor" novalidate>
        <h1>Intercambio de Videojuegos</h1>

        <label for="nombre">Nombre del Videojuego</label>
        <input id="nombre" name="nombre" type="text"
        placeholder="Ej. Super Mario Odyssey"
        minlength="3" maxlength="80" required>

        <label for="tipo">Género del Videojuego</label>
        <select id="tipo" name="tipo" required>
            <option value="">Seleccione un género</option>
            <option value="Acción">Acción</option>
            <option value="Aventura">Aventura</option>
            <option value="Carreras">Carreras</option>
            <option value="Deportes">Deportes</option>
            <option value="Estrategia">Estrategia</option>
            <option value="Plataformas">Plataformas</option>
            <option value="Rol">Rol</option>
            <option value="Simulación">Simulación</option>
            <option value="Terror">Terror</option>
        </select>

        <label for="estado">Estado del Videojuego</label> 
        <select id="estado" name="estado" required>  
            <option value="">Seleccione un estado</option>
            <option value="Nuevo">Nuevo</option>
            <option value="Como Nuevo">Como Nuevo</option>
            <option value="Buen Estado">Buen Estado</option>
            <option value="Con Desgaste">Con Desgaste</option>
        </select>
        
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion"
            placeholder="Indique las condiciones del videojuego y qué busca intercambiar" minlength="10" maxlength="500" required></textarea>

        <label for="email">Correo Electrónico</label>
        <input id="email" name="email" type="email" placeholder="Ej. jugador@correo.com" maxlength="254" autocomplete="email" required>

        <button id="boton" type="submit">Proponer Intercambio</button>
        <p id="mensaje" aria-live="polite" role="status"></p>
    </form>
    
    <footer>
        All rigths reserved - GameStop USA
    </footer>
</body> 
</html>
